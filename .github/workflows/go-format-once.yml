name: One-off Go formatting
on:
  push:
    branches: [feat/go-reference-runtime]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/go-reference-runtime
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - run: gofmt -w go/anwa/*.go go/examples/calculator/*.go
      - name: Commit canonical formatting and remove temporary workflow
        run: |
          rm .github/workflows/go-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/anwa go/examples .github/workflows/go-format-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(go): apply gofmt"
            git push origin HEAD:feat/go-reference-runtime
          fi
