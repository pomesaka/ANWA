name: One-off typed-results test formatting
on:
  push:
    branches: [refactor/typed-results-no-try-catch]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/typed-results-no-try-catch
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun fmt src demo test tools
      - name: Commit canonical formatting and remove one-off workflow
        run: |
          rm .github/workflows/result-test-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src demo test tools .github/workflows/result-test-format-once.yml
          git commit -m "style: canonical formatting for error-algebra regression tests"
          git push origin HEAD:refactor/typed-results-no-try-catch
