name: One-off Hono RPC formatting
on:
  push:
    branches: [feat/http-binding-adapters]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http-binding-adapters
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun fmt demo/http/hono.ts test/http-binding.test.ts test/hono-client-types.ts
      - name: Commit formatting and remove one-off workflow
        run: |
          rm .github/workflows/hono-rpc-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/http/hono.ts test/http-binding.test.ts test/hono-client-types.ts .github/workflows/hono-rpc-format-once.yml
          git commit -m "style(hono): format chained RPC example and type regression"
          git push origin HEAD:feat/http-binding-adapters
