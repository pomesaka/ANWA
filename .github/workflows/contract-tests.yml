name: ANWA Bun TypeScript contract checks

on:
  push:
    branches: [main, feat/advanced-todo-demo]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun run codegen
      - name: Temporary Bun formatter for Todo demo implementation branch
        if: github.ref == 'refs/heads/feat/advanced-todo-demo'
        run: |
          bun fmt src demo test tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src demo test tools
          if ! git diff --cached --quiet; then
            git commit -m "style: format advanced Todo demo with Bun"
            git push
          fi
      - run: bun check
      - run: git diff --exit-code -- demo/calculator/contract.generated.ts demo/orders/contract.generated.ts demo/reports/contract.generated.ts demo/todo/contract.generated.ts
      - run: bun fmt --check src demo test tools
      - run: bunx oxlint src demo test tools
      - run: bun run validate
      - run: bun run types:orders
      - run: bun check
      - run: bun test
      - run: bun run demo > /dev/null
      - run: bun run demo:todo > /dev/null
