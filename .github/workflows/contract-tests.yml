name: ANWA contract demos
on:
  push:
    branches: [main, feat/anwa-0.1-spec-and-demos]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo > /dev/null
