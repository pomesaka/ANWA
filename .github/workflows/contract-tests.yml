name: ANWA Bun TypeScript contract checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun fmt --check src demo test tools
      - run: bunx oxlint src demo test tools
      - run: bun run validate
      - run: bun run types:orders
      - run: bun check
      - run: bun test
      - run: bun run demo > /dev/null
