name: One-off Go Todo generation and formatting
on:
  push:
    branches: [feat/go-reference-runtime]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/go-reference-runtime
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Generate Todo contract
        working-directory: go
        run: go run ./cmd/anwa-codegen -in examples/todo/anwa.json -out examples/todo/contract.gen.go -package main
      - name: Format and commit once
        run: |
          gofmt -w go/examples/todo/*.go
          rm .github/workflows/go-todo-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/examples/todo .github/workflows/go-todo-once.yml
          git commit -m "chore(go): generate typed Todo server contract"
          git push origin HEAD:feat/go-reference-runtime
