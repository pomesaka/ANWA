name: One-off functional-refactor lock and formatting

on:
  push:
    branches: [refactor/typed-results-no-try-catch]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/typed-results-no-try-catch
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install
      - run: bun fmt src demo test tools
      - name: Commit canonical formatting and lockfile; remove one-off workflow
        run: |
          rm .github/workflows/typed-results-prepare-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock src demo test tools .github/workflows/typed-results-prepare-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock error-handling packages and format typed Result refactor"
            git push origin HEAD:refactor/typed-results-no-try-catch
          fi
