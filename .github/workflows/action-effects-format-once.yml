name: One-off Action policy formatting
on:
  push:
    branches: [feat/go-reference-runtime]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/go-reference-runtime
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - run: bun fmt src test demo tools
      - run: gofmt -w go/anwa/*.go
      - name: Commit formatting then delete temporary workflow
        run: |
          rm .github/workflows/action-effects-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test demo tools go/anwa .github/workflows/action-effects-format-once.yml
          git commit -m "style: canonical Bun and Go formatting for Action policy"
          git push origin HEAD:feat/go-reference-runtime
