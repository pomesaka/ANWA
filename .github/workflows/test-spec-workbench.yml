name: Test specification workbench
on:
  push:
    branches: [refactor/typed-results-no-try-catch]
    paths: [.github/workflows/test-spec-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Bundle sources and local test tools without Git credentials
        run: |
          mkdir -p "$RUNNER_TEMP/workbench"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/workbench"
          cp -a node_modules "$RUNNER_TEMP/workbench/node_modules"
          cp "$(command -v bun)" "$RUNNER_TEMP/workbench/bun"
          tar -czf "$RUNNER_TEMP/anwa-workbench.tar.gz" -C "$RUNNER_TEMP/workbench" .
      - uses: actions/upload-artifact@v4
        with:
          name: anwa-test-spec-workbench
          path: ${{ runner.temp }}/anwa-workbench.tar.gz
          retention-days: 1
