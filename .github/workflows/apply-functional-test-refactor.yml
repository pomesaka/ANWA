name: Apply verified functional test refactor
on:
  push:
    branches: [refactor/typed-results-no-try-catch]
    paths: [.github/workflows/apply-functional-test-refactor.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply content-verified edits without overwriting concurrent changes
        shell: python
        run: |
          import base64, hashlib, json, lzma
          from pathlib import Path
          root = Path.cwd()
          parts = [root / f'.github/test-spec-edits.part{i}' for i in range(4)]
          encoded = ''.join(part.read_text() for part in parts)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '3c7cd91989c0e90320a946aac08f827790ad569085ceaab7dbf6532108c069a2', 'Transfer checksum mismatch'
          changes = json.loads(lzma.decompress(base64.b64decode(encoded, validate=True)))
          assert len(changes) == 35
          prepared = []
          for change in changes:
              relative = Path(change['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              path = root / relative
              assert not path.is_symlink()
              original = path.read_bytes() if path.exists() else None
              actual = hashlib.sha256(original).hexdigest() if original is not None else None
              assert actual == change['old'], f'Base changed: {relative}'
              if change['new'] is None:
                  prepared.append((path, None))
                  continue
              lines = (original or b'').decode().splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              updated = ''.join(lines).encode()
              assert hashlib.sha256(updated).hexdigest() == change['new'], f'Output checksum mismatch: {relative}'
              prepared.append((path, updated))
          for path, updated in prepared:
              if updated is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(updated)
          for part in parts:
              part.unlink()
          (root / '.github/workflows/apply-functional-test-refactor.yml').unlink()
          print(f'Applied {len(prepared)} verified source edits; temporary files removed')
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - run: bun install --ignore-scripts
      - run: bun fmt --check src demo test tools
      - run: bun run architecture:check
      - run: bun check
      - run: bunx --no-install oxlint src demo test tools
      - run: bun test
      - run: bun run codegen && git diff --exit-code -- demo/calculator/contract.generated.ts demo/orders/contract.generated.ts demo/reports/contract.generated.ts demo/todo/contract.generated.ts
      - run: bun run validate && bun run demo > /dev/null && bun run demo:todo > /dev/null
      - working-directory: go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go run ./examples/calculator > /dev/null
          go run ./examples/todo > /dev/null
      - name: Commit verified source refactor, tests and dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md src demo docs spec test tools go package.json bun.lock .github
          git commit -m "refactor: closure-based runtime and table-driven executable specifications"
          git push origin HEAD:refactor/typed-results-no-try-catch
